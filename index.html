<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Điểm Danh FaceID</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --info: #0284c7;
            --info-hover: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 24px 16px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .card-header i {
            font-size: 1.2rem;
            color: var(--primary);
        }

        .card-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Camera Wrapper & Overlay Countdown */
        .webcam-container {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #0f172a;
        }

        video, canvas {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        .countdown-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 5rem;
            font-weight: 800;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .countdown-overlay.active {
            opacity: 1;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            color: white;
            background-color: var(--primary);
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: var(--success-hover); }
        .btn-info { background-color: var(--info); }
        .btn-info:hover { background-color: var(--info-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .divider {
            margin: 20px 0;
            border-top: 1px dashed var(--border);
        }

        .result-box {
            margin-top: 14px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            display: none;
            word-break: break-all;
            line-height: 1.5;
        }

        .result-box.success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .result-box.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .table-container {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        tr:last-child td { border-bottom: none; }

        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #e2e8f0;
            color: #475569;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-camera-retro"></i> Hệ Thống Điểm Danh FaceID</h1>
        </header>

        <div class="grid">
            <!-- WEBCAM -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-video"></i>
                    <h2>Webcam Trực Tiếp</h2>
                </div>
                <div class="webcam-container">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="canvas" style="display: none;"></canvas>
                    <div id="countdown" class="countdown-overlay">3</div>
                </div>
                <p style="font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-top: 10px;">
                    <i class="fa-solid fa-circle-info"></i> Giữ yên mặt trước camera khi bấm chụp.
                </p>
            </div>

            <!-- ĐĂNG KÝ MỚI -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-user-plus"></i>
                    <h2>Đăng Ký Nhân Viên</h2>
                </div>
                <div class="form-group">
                    <label><i class="fa-regular fa-user"></i> Họ và Tên:</label>
                    <input type="text" id="reg_name" placeholder="Ví dụ: Nguyễn Văn A">
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-briefcase"></i> Chức vụ:</label>
                    <input type="text" id="reg_position" value="Nhân viên" placeholder="Ví dụ: Developer">
                </div>
                <button id="btn_reg" class="btn btn-success" onclick="startCapture('register')">
                    <i class="fa-solid fa-camera"></i> Chụp & Đăng Ký
                </button>
                <div id="reg_result" class="result-box"></div>
            </div>
        </div>

        <div class="grid">
            <!-- ĐIỂM DANH & IMPORT -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-clock"></i>
                    <h2>Điểm Danh & Import</h2>
                </div>
                
                <button id="btn_att" class="btn" onclick="startCapture('attendance')">
                    <i class="fa-solid fa-expand"></i> Chụp & Điểm Danh
                </button>
                <div id="att_result" class="result-box"></div>

                <div class="divider"></div>

                <div class="form-group">
                    <label><i class="fa-solid fa-file-import"></i> Import Hàng Loạt (TênFile_ChucVu.jpg):</label>
                    <input type="file" id="file_import" multiple accept="image/*">
                </div>
                <button id="btn_import" class="btn btn-info" onclick="uploadBatchFiles()">
                    <i class="fa-solid fa-upload"></i> Tải Lên & Đăng Ký
                </button>
                <div id="import_result" class="result-box"></div>
            </div>

            <!-- DANH SÁCH -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-users"></i>
                    <h2>Danh Sách Nhân Viên</h2>
                </div>
                <button class="btn btn-info" onclick="loadUsers()" style="margin-bottom: 12px;">
                    <i class="fa-solid fa-rotate"></i> Tải Lại Danh Sách
                </button>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tên</th>
                                <th>Chức vụ</th>
                                <th>Ngày tạo</th>
                            </tr>
                        </thead>
                        <tbody id="user_table_body">
                            <tr>
                                <td colspan="4" style="text-align:center; color: var(--text-muted);">
                                    Nhấn nút để lấy dữ liệu...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000/api";
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const countdownEl = document.getElementById('countdown');

        // 1. Mở Webcam
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Không thể truy cập camera: " + err); });

        // 2. Chụp ảnh Base64
        function captureBase64() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.9);
        }

        // 3. Đếm ngược 3 giây trước khi bấm chụp
        function startCapture(actionType) {
            let count = 3;
            countdownEl.innerText = count;
            countdownEl.classList.add('active');

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.innerText = count;
                } else {
                    clearInterval(timer);
                    countdownEl.classList.remove('active');
                    if (actionType === 'register') {
                        registerUser();
                    } else if (actionType === 'attendance') {
                        processAttendance();
                    }
                }
            }, 800);
        }

        // 4. Xử lý Đăng Ký
        async function registerUser() {
            const name = document.getElementById('reg_name').value.trim();
            const position = document.getElementById('reg_position').value.trim();
            const resBox = document.getElementById('reg_result');

            if (!name) { alert("Vui lòng nhập tên nhân viên!"); return; }

            const base64Image = captureBase64();
            showResult(resBox, "<i class='fa-solid fa-spinner fa-spin'></i> Đang xử lý đăng ký...", false);

            try {
                const response = await fetch(`${API_BASE}/users/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, position, face_image_base64: base64Image })
                });
                const data = await response.json();

                if (response.ok) {
                    showResult(resBox, `<i class="fa-solid fa-circle-check"></i> Đăng ký thành công! ID: ${data.id} - ${data.name}`, true);
                    document.getElementById('reg_name').value = '';
                    loadUsers();
                } else {
                    showResult(resBox, `<i class="fa-solid fa-triangle-exclamation"></i> Lỗi: ${data.detail}`, false);
                }
            } catch (err) {
                showResult(resBox, `<i class="fa-solid fa-triangle-exclamation"></i> Lỗi kết nối: ${err.message}`, false);
            }
        }

        // 5. Xử lý Điểm Danh
        async function processAttendance() {
            const resBox = document.getElementById('att_result');
            const base64Image = captureBase64();
            showResult(resBox, "<i class='fa-solid fa-spinner fa-spin'></i> Đang nhận diện...", false);

            try {
                const response = await fetch(`${API_BASE}/attendance/process`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_base64: base64Image })
                });
                const data = await response.json();

                if (response.ok) {
                    let text = `<i class="fa-solid fa-circle-check"></i> <b>[${data.status.toUpperCase()}]</b> ${data.user_name} (${data.position})`;
                    if (data.check_in) text += `<br>Check-in: ${data.check_in}`;
                    if (data.check_out) text += `<br>Check-out: ${data.check_out}`;
                    showResult(resBox, text, true);
                } else {
                    showResult(resBox, `<i class="fa-solid fa-triangle-exclamation"></i> Lỗi: ${data.detail}`, false);
                }
            } catch (err) {
                showResult(resBox, `<i class="fa-solid fa-triangle-exclamation"></i> Lỗi kết nối: ${err.message}`, false);
            }
        }

        // 6. Xử lý Import Hàng Loạt File
        async function uploadBatchFiles() {
            const fileInput = document.getElementById('file_import');
            const resBox = document.getElementById('import_result');
            if (fileInput.files.length === 0) { alert("Vui lòng chọn ít nhất 1 ảnh!"); return; }

            const formData = new FormData();
            for (let i = 0; i < fileInput.files.length; i++) {
                formData.append('files', fileInput.files[i]);
            }

            showResult(resBox, "<i class='fa-solid fa-spinner fa-spin'></i> Đang xử lý import...", false);

            try {
                const response = await fetch(`${API_BASE}/users/import-files`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (response.ok) {
                    let msg = `<i class="fa-solid fa-circle-check"></i> <b>Kết quả Import:</b> Thành công ${data.success_count}/${data.total}<br>`;
                    if (data.errors.length > 0) {
                        msg += `<br><b>Thất bại:</b><br>` + data.errors.map(e => `- ${e.file}: ${e.reason}`).join('<br>');
                    }
                    showResult(resBox, msg, data.failed_count === 0);
                    loadUsers();
                } else {
                    showResult(resBox, `<i class="fa-solid fa-triangle-exclamation"></i> Lỗi: ${data.detail}`, false);
                }
            } catch (err) {
                showResult(resBox, `<i class="fa-solid fa-triangle-exclamation"></i> Lỗi kết nối: ${err.message}`, false);
            }
        }

        // 7. Lấy danh sách nhân viên
        async function loadUsers() {
            const tbody = document.getElementById('user_table_body');
            try {
                const response = await fetch(`${API_BASE}/users/list?limit=50&offset=0`);
                const data = await response.json();

                if (response.ok) {
                    if (data.users.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--text-muted);">Chưa có nhân viên nào.</td></tr>';
                        return;
                    }
                    tbody.innerHTML = data.users.map(u => `
                        <tr>
                            <td><b>#${u.id}</b></td>
                            <td>${u.name}</td>
                            <td><span class="badge">${u.position}</span></td>
                            <td>${new Date(u.created_at).toLocaleDateString('vi-VN')}</td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" style="color:red; text-align:center;">Lỗi tải dữ liệu: ${err.message}</td></tr>`;
            }
        }

        function showResult(element, text, isSuccess) {
            element.style.display = 'block';
            element.className = `result-box ${isSuccess ? 'success' : 'error'}`;
            element.innerHTML = text;
        }
    </script>
</body>

</html>
