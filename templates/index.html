<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm Danh Bằng Khuôn Mặt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hiệu ứng radar-scan overlay */
        #overlay {
            position: absolute;
            border: 4px solid rgba(16, 185, 129, 0.6); /* Emerald color */
            border-radius: 50%;
            width: 260px;
            height: 260px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70%  { box-shadow: 0 0 0 30px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

<div class="max-w-xl w-full bg-gray-800 rounded-2xl shadow-2xl p-6 border border-gray-700 flex flex-col items-center">
    <h1 class="text-2xl font-bold text-center mb-6 text-emerald-400">ĐIỂM DANH KHUÔN MẶT</h1>

    <!-- Khung Video Camera -->
    <div class="relative w-full aspect-[4/3] bg-black rounded-xl overflow-hidden border-2 border-emerald-500/30">
        <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <div id="overlay"></div>
    </div>

    <div class="grid grid-cols-1 gap-4 w-full">
        <button id="btn-register-open" onclick="toggleRegisterPanel()"
                class="w-full py-3.5 bg-blue-500 hover:bg-blue-600 active:scale-98 transition-all font-semibold rounded-xl shadow-lg shadow-blue-500/20 text-lg flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span>Đăng ký user mới</span>
        </button>

        <button id="btn-capture" onclick="takeAttendance()" 
                class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 disabled:bg-gray-600 disabled:cursor-not-allowed active:scale-98 transition-all font-semibold rounded-xl shadow-lg shadow-emerald-500/20 text-lg flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span>Chụp Ảnh Điểm Danh</span>
        </button>
    </div>

    <div id="register-panel" class="mt-4 w-full bg-gray-900/70 border border-blue-500/40 rounded-2xl p-4 hidden">
        <div class="flex flex-col gap-3">
            <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                <label class="block text-sm font-medium text-gray-200">
                    Họ và tên
                    <input id="register-name" type="text" placeholder="Nhập họ tên" class="mt-2 w-full rounded-xl border border-gray-700 bg-gray-800 px-4 py-2 text-white focus:border-blue-400 focus:outline-none" />
                </label>
                <label class="block text-sm font-medium text-gray-200">
                    Chức vụ
                    <input id="register-position" type="text" placeholder="Nhập chức vụ" class="mt-2 w-full rounded-xl border border-gray-700 bg-gray-800 px-4 py-2 text-white focus:border-blue-400 focus:outline-none" />
                </label>
            </div>
            <div class="flex flex-col gap-3 sm:flex-row">
                <button id="btn-register" onclick="registerUser()"
                        class="w-full sm:w-auto py-3.5 bg-blue-500 hover:bg-blue-600 disabled:bg-gray-600 disabled:cursor-not-allowed transition-all font-semibold rounded-xl shadow-lg shadow-blue-500/20 text-lg flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <span>Đăng ký khuôn mặt</span>
                </button>
                <button onclick="toggleRegisterPanel()"
                        class="w-full sm:w-auto py-3.5 bg-gray-700 hover:bg-gray-600 transition-all font-semibold rounded-xl text-sm text-gray-200">
                    Hủy
                </button>
            </div>
        </div>
    </div>

    <!-- Hộp hiển thị thông báo kết quả -->
    <div id="msg" class="mt-4 w-full text-center text-lg min-h-[48px] flex items-center justify-center rounded-xl transition-all p-3"></div>
</div>

<script>
const video = document.getElementById('video');
const msgBox = document.getElementById('msg');
const btnCapture = document.getElementById('btn-capture');
const btnRegisterOpen = document.getElementById('btn-register-open');
const btnRegister = document.getElementById('btn-register');
const registerPanel = document.getElementById('register-panel');

// Bật webcam
async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { width: { ideal: 640 }, height: { ideal: 480 } } 
        });
        video.srcObject = stream;
    } catch (e) {
        msgBox.className = "mt-4 w-full text-center text-red-400 bg-red-950/40 border border-red-500/40 rounded-xl p-3";
        msgBox.textContent = "Không thể truy cập webcam. Vui lòng cấp quyền truy cập camera.";
        btnCapture.disabled = true;
    }
}

// Hàm chụp ảnh và gửi API khi nhấn nút
async function takeAttendance() {
    if (!video.srcObject) return;

    // Kiểm tra camera đã sẵn sàng chưa
    if (video.readyState < 2 || video.videoWidth === 0) {
        msgBox.className = "mt-4 w-full text-center text-rose-300 bg-rose-950/40 border border-rose-500/40 rounded-xl p-3";
        msgBox.textContent = "Camera chưa sẵn sàng. Vui lòng đợi một chút rồi thử lại.";
        return;
    }
    // 1. Disable nút bấm & hiển thị trạng thái đang quét
    btnCapture.disabled = true;
    btnCapture.innerHTML = `
        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Đang xử lý...</span>
    `;
    
    msgBox.className = "mt-4 w-full text-center text-amber-300 bg-amber-950/30 border border-amber-500/30 rounded-xl p-3";
    msgBox.textContent = "Đang kiểm tra liveness và nhận diện...";

    // 2. Chụp ảnh từ canvas
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataURL = canvas.toDataURL('image/jpeg');

    // 3. Gửi request tới Backend
    try {
        const response = await fetch('/api/attendance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: dataURL })
        });
        
        const resp = await response.json();

        if (resp.success) {
            msgBox.className = "mt-4 w-full text-center text-emerald-300 bg-emerald-950/40 border border-emerald-500/40 rounded-xl p-3";
            msgBox.innerHTML = `
                <div>
                    <span class="font-bold text-xl">🎉 ${resp.message}</span><br>
                    <span class="text-sm text-gray-300">Họ tên: <strong>${resp.name}</strong> | Chức vụ: <strong>${resp.position}</strong></span>
                </div>
            `;
        } else {
            msgBox.className = "mt-4 w-full text-center text-rose-300 bg-rose-950/40 border border-rose-500/40 rounded-xl p-3";
            msgBox.innerHTML = `<span class="font-semibold">❌ ${resp.message}</span>`;
        }
    } catch (err) {
        msgBox.className = "mt-4 w-full text-center text-rose-300 bg-rose-950/40 border border-rose-500/40 rounded-xl p-3";
        msgBox.textContent = "Lỗi kết nối tới Server!";
    } finally {
        // 4. Mở lại nút bấm sau 2 giây (cooldown để tránh spam)
        setTimeout(() => {
            btnCapture.disabled = false;
            btnCapture.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span>Chụp Ảnh Điểm Danh</span>
            `;
        }, 2000);
    }
}

function toggleRegisterPanel() {
    registerPanel.classList.toggle('hidden');
}

async function registerUser() {
    if (!video.srcObject) return;

    // Kiểm tra camera đã sẵn sàng chưa
    if (video.readyState < 2 || video.videoWidth === 0) {
        msgBox.className = "mt-4 w-full text-center text-rose-300 bg-rose-950/40 border border-rose-500/40 rounded-xl p-3";
        msgBox.textContent = "Camera chưa sẵn sàng. Vui lòng đợi một chút rồi thử lại.";
        return;
    }

    const name = document.getElementById('register-name').value.trim();
    const position = document.getElementById('register-position').value.trim();

    if (!name || !position) {
        msgBox.className = "mt-4 w-full text-center text-rose-300 bg-rose-950/40 border border-rose-500/40 rounded-xl p-3";
        msgBox.textContent = "Vui lòng điền đầy đủ họ tên và chức vụ.";
        return;
    }

    btnRegister.disabled = true;
    btnRegister.innerHTML = `
        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Đang đăng ký...</span>
    `;

    msgBox.className = "mt-4 w-full text-center text-amber-300 bg-amber-950/30 border border-amber-500/30 rounded-xl p-3";
    msgBox.textContent = "Đang chụp ảnh và đăng ký user...";

    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataURL = canvas.toDataURL('image/jpeg');

    try {
        const response = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: dataURL, name, position })
        });

        let resp = {};
        try {
            resp = await response.json();
        } catch (jsonErr) {
            resp = { detail: response.statusText || 'Server trả về dữ liệu không hợp lệ' };
        }

        const message = typeof resp.message === 'string' && resp.message.trim()
            ? resp.message
            : Array.isArray(resp.detail)
                ? resp.detail.map(item => item.msg || item).join('; ')
                : (resp.detail || resp.error || 'Đăng ký thất bại. Vui lòng thử lại.');

        if (response.ok && resp.success) {
            msgBox.className = "mt-4 w-full text-center text-emerald-300 bg-emerald-950/40 border border-emerald-500/40 rounded-xl p-3";
            msgBox.innerHTML = `
                <div>
                    <span class="font-bold text-xl">✅ ${message}</span><br>
                    <span class="text-sm text-gray-300">Họ tên: <strong>${resp.name}</strong> | Chức vụ: <strong>${resp.position}</strong></span>
                </div>
            `;
            registerPanel.classList.add('hidden');
            document.getElementById('register-name').value = '';
            document.getElementById('register-position').value = '';
        } else {
            msgBox.className = "mt-4 w-full text-center text-rose-300 bg-rose-950/40 border border-rose-500/40 rounded-xl p-3";
            msgBox.innerHTML = `<span class="font-semibold">❌ ${message}</span>`;
        }
    } catch (err) {
        msgBox.className = "mt-4 w-full text-center text-rose-300 bg-rose-950/40 border border-rose-500/40 rounded-xl p-3";
        msgBox.textContent = "Lỗi kết nối tới Server khi đăng ký user.";
    } finally {
        btnRegister.disabled = false;
        btnRegister.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <span>Đăng ký khuôn mặt</span>
        `;
    }
}

window.onload = startCamera;
</script>
</body>
</html>
